name: "setup-poetry-env"
description: 'Sets up Poetry and installs dependencies, using system-installed torch/transformers'

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.13'

runs:
  using: "composite"
  steps:
  - name: Install Poetry
    uses: snok/install-poetry@v1
    with:
      version: latest
      virtualenvs-create: true
      virtualenvs-in-project: true

  - name: Configure Poetry to use system site packages
    run: poetry config virtualenvs.options.system-site-packages true
    shell: bash

  - name: Install dependencies
    run: poetry install --no-interaction --without inference
    shell: bash
