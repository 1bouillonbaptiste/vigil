name: "setup-poetry-env"
description: 'Sets up Poetry with caching, using system-installed torch/transformers'

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.13'

runs:
  using: "composite"
  steps:
  - name: Install Poetry
    uses: snok/install-poetry@v1
    with:
      version: latest
      virtualenvs-create: true
      virtualenvs-in-project: true

  - name: Configure Poetry to use system site packages
    run: poetry config virtualenvs.options.system-site-packages true
    shell: bash

  - name: Cache Poetry virtual environment
    uses: actions/cache@v3
    with:
      path: .venv
      key: ${{ runner.os }}-venv-${{ inputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      restore-keys: |
        ${{ runner.os }}-venv-${{ inputs.python-version }}-

  - name: Install dependencies
    run: poetry install --no-interaction
    shell: bash
